<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>¿Dónde está Tito? - Carga Dinámica JSON</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #111; color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    /* HEADER */
    header {
      height: 70px; background: #222; border-bottom: 2px solid #444;
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 10;
    }
    .level-info h2 { font-size: 1.1rem; color: #ffcc00; }
    .targets-container { display: flex; gap: 15px; }
    .target-card {
      position: relative; width: 50px; height: 50px; border-radius: 50%;
      border: 3px solid #ffcc00; overflow: hidden; background: #333; transition: transform 0.2s;
    }
    .target-card img { width: 100%; height: 100%; object-fit: cover; }
    .target-card.found { border-color: #2ec4b6; filter: grayscale(80%); opacity: 0.6; }
    .target-card.found::after {
      content: '✓'; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(46, 196, 182, 0.7); color: white; display: flex; align-items: center;
      justify-content: center; font-size: 24px; font-weight: bold;
    }

    /* VIEWPORT */
    #game-container {
      flex: 1; position: relative; overflow: hidden; cursor: grab; touch-action: none; background: #000;
    }
    #game-container:active { cursor: grabbing; }
    #canvas-wrapper { position: absolute; transform-origin: 0 0; }
    #level-image { display: block; user-select: none; pointer-events: none; }

    /* HITBOXES */
    .hitbox {
      position: absolute; border: 2px dashed rgba(255, 0, 0, 0.5);
      background: rgba(255, 0, 0, 0.15); cursor: pointer; border-radius: 4px;
    }

    /* MINIMAPA */
    #minimap-container {
      position: absolute; bottom: 15px; left: 15px; width: 180px; height: 101px;
      border: 2px solid #fff; background: #222; overflow: hidden; z-index: 5; box-shadow: 0 0 10px rgba(0,0,0,0.8);
    }
    #minimap-image { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
    #minimap-viewport {
      position: absolute; border: 2px solid #2ecc71; background: transparent;
      pointer-events: none; display: none; box-sizing: border-box;
    }

    /* MODAL DE VICTORIA */
    #victory-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 100; justify-content: center; align-items: center; flex-direction: column;
    }
    #victory-modal.active { display: flex; }
    .modal-box { background: #222; padding: 30px; border-radius: 12px; text-align: center; border: 2px solid #ffcc00; }
    .modal-box button {
      margin-top: 15px; padding: 10px 20px; font-size: 16px; background: #ffcc00;
      border: none; cursor: pointer; border-radius: 6px; font-weight: bold;
    }

    /* PANTALLA DE CARGA */
    #loading-screen {
      position: absolute; inset: 0; background: #111; z-index: 200;
      display: flex; justify-content: center; align-items: center; font-size: 1.5rem; color: #ffcc00;
    }
    #loading-screen.hidden { display: none; }
  </style>
</head>
<body>

  <div id="loading-screen">Cargando Nivel...</div>

  <!-- HEADER UI -->
  <header>
    <div class="level-info">
      <h2 id="level-title">Cargando...</h2>
    </div>
    <div class="targets-container" id="header-targets"></div>
  </header>

  <!-- AREA PRINCIPAL -->
  <div id="game-container">
    <div id="canvas-wrapper">
      <img id="level-image" alt="Escenario Principal">
      <div id="hitbox-layer"></div>
    </div>

    <!-- MINIMAPA -->
    <div id="minimap-container">
      <img id="minimap-image" alt="Minimapa">
      <div id="minimap-viewport"></div>
    </div>
  </div>

  <!-- MODAL VICTORIA -->
  <div id="victory-modal">
    <div class="modal-box">
      <h1>¡NIVEL COMPLETADO! 🎉</h1>
      <p>Has encontrado a todos los personajes.</p>
      <button onclick="loadLevel(currentLevelId)">Reiniciar Nivel</button>
    </div>
  </div>

  <script>
    // --- ESTADO GLOBAL Y LÓGICA DE CARGA DINÁMICA ---
    let currentLevelId = 1;
    let levelData = null;
    let foundTargets = new Set();
    
    let scale = 1, minScale = 1;
    const maxScale = 3.5;
    let posX = 0, posY = 0;
    let isDragging = false;
    let startX = 0, startY = 0;

    // DOM References
    const container = document.getElementById('game-container');
    const wrapper = document.getElementById('canvas-wrapper');
    const img = document.getElementById('level-image');
    const miniImg = document.getElementById('minimap-image');
    const hitboxLayer = document.getElementById('hitbox-layer');
    const headerTargets = document.getElementById('header-targets');
    const miniViewport = document.getElementById('minimap-viewport');
    const levelTitle = document.getElementById('level-title');
    const loadingScreen = document.getElementById('loading-screen');
    const victoryModal = document.getElementById('victory-modal');

    // --- CARGA DINÁMICA POR FETCH (JSON) ---
    async function loadLevel(levelId) {
      showLoading(true);
      victoryModal.classList.remove('active');
      foundTargets.clear();

      try {
        // Petición asíncrona para obtener el JSON del nivel
        const response = await fetch(`./levels/level${levelId}.json`);
        if (!response.ok) throw new Error(`No se pudo cargar level${levelId}.json`);
        
        levelData = await response.json();
        
        // Cargar imagen principal y esperar a que complete
        img.src = levelData.imageSrc;
        miniImg.src = levelData.imageSrc;
        levelTitle.textContent = levelData.title;

        img.onload = () => {
          initLevel();
          showLoading(false);
        };

      } catch (error) {
        console.error("Error al cargar el nivel:", error);
        loadingScreen.textContent = `Error cargando el Nivel ${levelId}`;
      }
    }

    function showLoading(active) {
      if (active) loadingScreen.classList.remove('hidden');
      else loadingScreen.classList.add('hidden');
    }

    // --- INICIALIZACIÓN DE COMPONENTES DEL NIVEL ---
    function initLevel() {
      renderHeaderUI();
      renderHitboxes();
      calculateMinScale();
      centerImage();
      updateTransform();
    }

    function renderHeaderUI() {
      headerTargets.innerHTML = levelData.targets.map(t => `
        <div class="target-card" id="card-${t.id}">
          <img src="${t.avatar}" title="${t.name}">
        </div>
      `).join('');
    }

    function renderHitboxes() {
      hitboxLayer.innerHTML = levelData.targets.map(t => `
        <div class="hitbox" id="hb-${t.id}" style="
          left: ${t.hitbox.x}%; top: ${t.hitbox.y}%;
          width: ${t.hitbox.width}%; height: ${t.hitbox.height}%;
        "></div>
      `).join('');

      levelData.targets.forEach(t => {
        document.getElementById(`hb-${t.id}`).addEventListener('click', (e) => {
          e.stopPropagation();
          onTargetFound(t.id);
        });
      });
    }

    function onTargetFound(id) {
      if (foundTargets.has(id)) return;
      foundTargets.add(id);

      document.getElementById(`card-${id}`).classList.add('found');
      document.getElementById(`hb-${id}`).style.borderColor = '#2ecc71';
      document.getElementById(`hb-${id}`).style.background = 'rgba(46, 204, 113, 0.4)';

      if (foundTargets.size === levelData.targets.length) {
        setTimeout(() => victoryModal.classList.add('active'), 300);
      }
    }

    // --- MOTOR DE PAN, ZOOM Y MINIMAPA ---
    function calculateMinScale() {
      const scaleX = container.clientWidth / levelData.imageWidth;
      const scaleY = container.clientHeight / levelData.imageHeight;
      minScale = Math.max(scaleX, scaleY);
      scale = minScale;
    }

    function clampPositions() {
      const maxTransX = 0;
      const minTransX = container.clientWidth - (levelData.imageWidth * scale);
      const maxTransY = 0;
      const minTransY = container.clientHeight - (levelData.imageHeight * scale);

      posX = Math.min(maxTransX, Math.max(minTransX, posX));
      posY = Math.min(maxTransY, Math.max(minTransY, posY));
    }

    function centerImage() {
      posX = (container.clientWidth - levelData.imageWidth * scale) / 2;
      posY = (container.clientHeight - levelData.imageHeight * scale) / 2;
    }

    function updateTransform() {
      clampPositions();
      wrapper.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
      updateMinimap();
    }

    function updateMinimap() {
      const miniWidth = 180;
      const miniHeight = 101;

      const visibleWPct = container.clientWidth / (levelData.imageWidth * scale);
      const visibleHPct = container.clientHeight / (levelData.imageHeight * scale);

      // Si está en Zoom Out total (escenario 100% visible), ocultar recuadro
      if (visibleWPct >= 0.99 && visibleHPct >= 0.99) {
        miniViewport.style.display = 'none';
        return;
      }

      miniViewport.style.display = 'block';
      const boxW = Math.min(miniWidth, miniWidth * visibleWPct);
      const boxH = Math.min(miniHeight, miniHeight * visibleHPct);

      const boxX = (-posX / (levelData.imageWidth * scale)) * miniWidth;
      const boxY = (-posY / (levelData.imageHeight * scale)) * miniHeight;

      miniViewport.style.width = `${boxW}px`;
      miniViewport.style.height = `${boxH}px`;
      miniViewport.style.transform = `translate(${boxX}px, ${boxY}px)`;
    }

    // --- EVENTOS DE INTERACCIÓN ---
    function setupEvents() {
      container.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - posX;
        startY = e.clientY - posY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        posX = e.clientX - startX;
        posY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener('mouseup', () => isDragging = false);

      container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
        const newScale = Math.min(maxScale, Math.max(minScale, scale * zoomFactor));

        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        posX = mouseX - (mouseX - posX) * (newScale / scale);
        posY = mouseY - (mouseY - posY) * (newScale / scale);
        scale = newScale;

        updateTransform();
      }, { passive: false });

      window.addEventListener('resize', () => {
        if (!levelData) return;
        calculateMinScale();
        updateTransform();
      });
    }

    // Arrancar aplicación
    setupEvents();
    loadLevel(currentLevelId);
  </script>
</body>
</html>
